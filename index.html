<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>蔵書管理</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>蔵書管理</h1>
  <div class="control-row">
    <input id="search-input" type="search" placeholder="タイトル・著者で検索" autocomplete="off">
    <select id="sort-select" aria-label="並び替え">
      <option value="normal">通常表示</option>
      <option value="country">国別に整理</option>
      <option value="author">著者別に整理</option>
      <option value="publisher">出版社別に整理</option>
    </select>
  </div>
</header>

<main id="book-list" class="book-list" aria-live="polite"></main>

<p id="empty-message" class="empty-message" hidden>本が見つかりません</p>

<button id="add-button" class="fab" type="button" aria-label="本を追加">＋</button>

<div id="detail-view" class="sheet" hidden>
  <div class="sheet-inner">
    <button class="close-button" data-close="detail-view" type="button" aria-label="閉じる">×</button>
    <div id="detail-content"></div>
  </div>
</div>

<div id="add-view" class="sheet" hidden>
  <div class="sheet-inner">
    <button class="close-button" data-close="add-view" type="button" aria-label="閉じる">×</button>
    <div id="add-content"></div>
  </div>
</div>

<template id="book-card-template">
  <button class="book-card" type="button">
    <img class="book-card-cover" alt="">
    <div class="book-card-title"></div>
    <div class="book-card-author"></div>
  </button>
</template>

<script src="js/vendor/html5-qrcode.min.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/scan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
